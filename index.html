<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>XO Game</title>
</head>
<body class="w-screen h-screen bg-neutral-700">
    <h1 class="currPlayer text-center text-8xl mb-12"></h1>
    <div class="cells w-[600px] h-[500px] m-auto grid grid-rows-3 grid-cols-3 gap-4 justify-center content-center place-content-center">
        <div data-index="0" class="cell font-['Permanent_Marker',cursive] text-9xl text-center content-center bg-slate-600 border border-neutral-500 rounded-3xl cursor-pointer hover:bg-slate-500"></div>
        <div data-index="1" class="cell font-['Permanent_Marker',cursive] text-9xl text-center content-center bg-slate-600 border border-neutral-500 rounded-3xl cursor-pointer hover:bg-slate-500"></div>
        <div data-index="2" class="cell font-['Permanent_Marker',cursive] text-9xl text-center content-center bg-slate-600 border border-neutral-500 rounded-3xl cursor-pointer hover:bg-slate-500"></div>
        <div data-index="3" class="cell font-['Permanent_Marker',cursive] text-9xl text-center content-center bg-slate-600 border border-neutral-500 rounded-3xl cursor-pointer hover:bg-slate-500"></div>
        <div data-index="4" class="cell font-['Permanent_Marker',cursive] text-9xl text-center content-center bg-slate-600 border border-neutral-500 rounded-3xl cursor-pointer hover:bg-slate-500"></div>
        <div data-index="5" class="cell font-['Permanent_Marker',cursive] text-9xl text-center content-center bg-slate-600 border border-neutral-500 rounded-3xl cursor-pointer hover:bg-slate-500"></div>
        <div data-index="6" class="cell font-['Permanent_Marker',cursive] text-9xl text-center content-center bg-slate-600 border border-neutral-500 rounded-3xl cursor-pointer hover:bg-slate-500"></div>
        <div data-index="7" class="cell font-['Permanent_Marker',cursive] text-9xl text-center content-center bg-slate-600 border border-neutral-500 rounded-3xl cursor-pointer hover:bg-slate-500"></div>
        <div data-index="8" class="cell font-['Permanent_Marker',cursive] text-9xl text-center content-center bg-slate-600 border border-neutral-500 rounded-3xl cursor-pointer hover:bg-slate-500"></div>
    </div>
    <div class="score-reset w-[260px] m-auto mt-8 grid grid-rows-2 gap-2 place-items-center">
        <h2 class=""></h2>
        <button class="w-[160px] h-11 text-3xl text-center mt-3 bg-teal-700 hover:bg-teal-800 rounded-xl cursor-pointer row-start-2">Reset</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
